<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dispatcher Pay & Plan Verifier</title>
<style>
  :root{--navy:#1f3864;--accent:#2e75b6;--good:#1e7e34;--goodbg:#e2efda;--bad:#b02a37;--badbg:#fdecea;--warn:#9a6b00;--warnbg:#fff3cd;--line:#d9dee6;--bg:#f4f6f9;--ink:#1c2530;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--navy);color:#fff;padding:14px 18px}
  header h1{margin:0;font-size:18px}
  header p{margin:3px 0 0;font-size:12px;color:#c7d3e8}
  nav{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:0;z-index:5}
  nav button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--navy)}
  nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{max-width:920px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:16px;color:var(--navy)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:12px;font-weight:600;color:#52606d;margin-bottom:3px}
  input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .row{display:flex;align-items:center;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;margin:6px 0}
  .chk input{width:auto}
  button.act{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}
  button.ghost{background:#eef2f7;color:var(--navy);border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{background:#f0f3f8;color:var(--navy);font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
  .ok{background:var(--goodbg);color:var(--good)} .no{background:var(--badbg);color:var(--bad)} .na{background:#eceff3;color:#67727e}
  .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .muted{color:#67727e;font-size:12px}
  .banner{font-size:12px;background:var(--warnbg);color:var(--warn);border:1px solid #f0e0a8;border-radius:9px;padding:8px 10px;margin-bottom:12px}
  .statusbig{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;font-weight:700}
  .hint{font-size:11px;color:#8a94a0;margin-top:2px}
  .ot-box{border:1px dashed var(--accent);border-radius:9px;padding:10px;margin-top:6px;display:none}
  .ot-box.show{display:block}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header>
  <h1>Dispatcher Pay &amp; Plan Verifier</h1>
  <p>Domestic Flight Dispatcher (PAFCA) &middot; Private &middot; all data stays in this browser</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
/* ---------- contract data (PAFCA 2022-2024 Agreement, Section 13) ---------- */
const CHART = { // Standard (Domestic) Dispatcher monthly base by step, by effective-date column
  '2022':[7161,7711,8073,8587,8999,9228,9704,10038,10803,11176,12536],
  '2023':[7412,7981,8356,8888,9314,9551,10044,10389,11181,11567,12975],
  '2024':[7671,8260,8648,9199,9640,9885,10395,10753,11572,11972,13429]
};
const CHART_PREMIUM = { // Chief Dispatcher / Operations Manager / ATC Coordinator / Full-Time Instructor scale (13-A)
  '2022':[7681,8271,8659,9210,9652,9898,10408,10766,11587,11987,13445],
  '2023':[7950,8560,8962,9532,9990,10244,10772,11143,11993,12407,13916],
  '2024':[8228,8860,9276,9866,10339,10603,11149,11533,12412,12841,14403]
};
const HRS_YEAR = 1880;            // base*12/1880 reproduces the contract $55.20 Step-2 hourly
const LICENSE_FLAT = 370, LICENSE_VAR = 0.045;
const PAY_PERIODS = 24;           // semi-monthly
const STEPS_TOLERANCE = 1.50;     // $ tolerance for a "pass"

/* ---------- defaults / state ---------- */
const DEFAULTS = {
  hireDate:'2023-10-15',
  startBalance:180000, startBalanceDate:'2026-06-01', annualReturn:0.07,
  birthYear:1990, retireAge:55,
  jhanNetMonthly:0, jhanInvestAnnual:0,
  rothIRAannual:7000, hsaResumeYear:2026, hsaAnnual:7250, megaAnnualTarget:0,
  tgtTrad:0, tgtRoth:0, tgtEmployer:0, retAccounts:[],
  baseScale:'standard',                       // 'standard' = Domestic; 'premium' = Chief/OM/ATC Coord/FT Instructor
  quals:{ intlAreas:0, ifs:false, lca:false, wbom:false },   // monthly qualification premiums (13-A-7..10)
  premRates:{ intlFirst:200, intlAddl:100, intlCap:400, ifs:200, lca:200, wbom:200 },
  chartOverride:null, chartPremiumOverride:null, taxOverride:null,
  tradPct:0.06, rothPct:0.00,
  budget:[
    ['Housing (mortgage stack)',2727.80],
    ['Credit cards (Chase+Discover ~$7,284)',150],
    ['Car loan',363],['Student loan (MOHELA)',448],['Personal loan',150],
    ['Electric',250],['Phone',55],['Internet',67],['Water/sewer',45],
    ['Shopping',617],['Auto & Transport',371],['Dining & Drinks',279],['Groceries',249],
    ['Uncategorized',0],['Fees',123],['Legal',0],['Pets',80],['Software & Tech',80],
    ['Travel & Vacation',50],['Home & Garden',39],['Entertainment & Rec.',30],
    ['Health & Wellness',12],['Medical',8],['Personal Care',7],['Money to Jhan\u2019s Family',4],['Taxes',2]
  ],
  history:[], bigNet:0, littleNet:0
};
let S = load();
function load(){ try{ return Object.assign(structuredClone(DEFAULTS), JSON.parse(localStorage.getItem('dispatchPay')||'{}')); }catch(e){ return structuredClone(DEFAULTS);} }
function save(){ localStorage.setItem('dispatchPay', JSON.stringify(S)); }

/* ---------- PDF storage (IndexedDB \u2014 holds the actual paystub files on this device) ---------- */
let _db;
function idb(){ return new Promise((res,rej)=>{ if(_db)return res(_db); const r=indexedDB.open('dispatchPdf',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('pdfs'); r.onsuccess=()=>{_db=r.result;res(_db);}; r.onerror=()=>rej(r.error); }); }
async function idbPut(id,blob){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('pdfs','readwrite'); tx.objectStore('pdfs').put(blob,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(id){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('pdfs','readonly'); const rq=tx.objectStore('pdfs').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(id){ const db=await idb(); return new Promise(res=>{ const tx=db.transaction('pdfs','readwrite'); tx.objectStore('pdfs').delete(id); tx.oncomplete=()=>res(); }); }
async function openPdf(id){ try{ const b=await idbGet(id); if(!b){ alert('That PDF isn\u2019t stored on this device. PDFs are saved per-device when you upload them here.'); return; }
  const u=URL.createObjectURL(b); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),60000); }catch(e){ alert('Could not open PDF: '+e.message); } }
function reviewLast(){ if(window.__lastFile) reviewPdf(window.__lastFile); }
async function downloadPdf(id,date){ try{ const b=await idbGet(id); if(!b){alert('PDF not on this device.');return;}
  const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='paystub-'+(date||'unknown')+'.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); }catch(e){ alert(e.message); } }
async function exportAllPdfs(){
  const withPdf=S.history.filter(h=>h.pdfId);
  if(!withPdf.length){ alert('No stored paystub PDFs yet.'); return; }
  if(window.showDirectoryPicker){ try{ const dir=await window.showDirectoryPicker();
      for(const h of withPdf){ const b=await idbGet(h.pdfId); if(!b)continue; const fh=await dir.getFileHandle('paystub-'+h.date+'.pdf',{create:true}); const w=await fh.createWritable(); await w.write(b); await w.close(); }
      alert('Exported '+withPdf.length+' paystub(s), named by pay date.'); return; }catch(e){ if(e.name==='AbortError')return; }
  }
  for(const h of withPdf){ await downloadPdf(h.pdfId,h.date); await new Promise(r=>setTimeout(r,300)); }
}
/* ---------- folder sync (desktop Chrome/Edge) ---------- */
async function connectFolder(){
  if(!window.showDirectoryPicker){ alert('Folder sync needs desktop Chrome or Edge. On iPhone, use the Save / Export buttons instead.'); return; }
  try{ const dir=await window.showDirectoryPicker({mode:'read'}); await idbPut('__pdfdir', dir);
    alert('Folder connected. Tap \u201cImport new from folder\u201d (or just reopen the app) to pull in paystubs.'); importFromFolder(); }
  catch(e){ if(e.name!=='AbortError') alert(e.message); }
}
async function importFromFolder(silent){
  let dir; try{ dir=await idbGet('__pdfdir'); }catch(e){}
  if(!dir){ if(!silent) alert('Connect a folder first (button to the right).'); return; }
  try{ if(dir.queryPermission){ let p=await dir.queryPermission({mode:'read'});
      if(p!=='granted'){ if(silent) return; p=await dir.requestPermission({mode:'read'}); if(p!=='granted'){ alert('Folder permission denied.'); return; } } }
    let added=0;
    for await (const [name,handle] of dir.entries()){
      if(handle.kind!=='file' || !/\.pdf$/i.test(name)) continue;
      const file=await handle.getFile(); let lines; try{ lines=await fileToLines(file); }catch(e){ continue; }
      const r=checkParsed(lines); if(r.date==='?') continue;
      if(S.history.some(h=>h.date===r.date)) continue;     // already in the queue
      await storeAndRecord(file, lines, 'new'); added++;
    }
    save(); if(tab==='history')render();
    if(!silent) alert(added?('Imported '+added+' new paystub(s) into the queue.'):'No new paystubs found in the folder.');
  }catch(e){ if(!silent) alert('Folder import error: '+e.message); }
}
/* ---------- shared data file (export / import all numbers) ---------- */
function exportData(){ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='dispatch-app-data.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); }
async function importData(ev){ const f=ev.target.files[0]; if(!f)return;
  try{ const o=JSON.parse(await f.text()); if(!o||typeof o!=='object') throw new Error('not valid');
    S=Object.assign(structuredClone(DEFAULTS), o); save(); render(); alert('Data imported \u2014 budget, queue and settings updated.'); }
  catch(e){ alert('Could not read that data file: '+e.message); } }
/* render the stub and draw red circles around the flagged lines */
async function reviewPdf(src){
  let blob = (typeof src==='string') ? await idbGet(src) : src;
  if(!blob){ alert('PDF not stored on this device.'); return; }
  if(typeof src==='string'){ const h=S.history.find(x=>x.pdfId===src); if(h&&h.status!=='reviewed'){ h.status='reviewed'; save(); if(tab==='history')render(); } }
  const buf = await blob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[]; let allLines=[];
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const rowsby={}; tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (rowsby[y]=rowsby[y]||[]).push(it); });
    const lines=[]; Object.keys(rowsby).map(Number).sort((a,b)=>b-a).forEach(y=>{ const its=rowsby[y].sort((a,b)=>a.transform[4]-b.transform[4]);
      const text=its.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim(); if(!text)return;
      const x0=Math.min(...its.map(i=>i.transform[4])); const last=its[its.length-1]; const x1=last.transform[4]+(last.width||30);
      lines.push({text,y,x0,x1}); allLines.push(text); });
    pages.push({page,lines}); }
  const r=checkParsed(allLines); const flags=[];
  (r.issues||[]).forEach(is=>{ if(/base off/.test(is))flags.push({re:/^Regular Pay/i,reason:'Base pay doesn\u2019t match your step rate'});
    else if(/license off/.test(is))flags.push({re:/Dispatcher License Pay/i,reason:'License premium is off'});
    else if(/net mismatch/.test(is))flags.push({re:/Net Pay/i,reason:'Net pay doesn\u2019t reconcile'});
    else if(/ rate$/.test(is)){ const l=is.replace(/ rate$/,''); flags.push({re:new RegExp('^'+l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),reason:l+': wrong hourly rate'}); } });
  // overlay
  let m=document.getElementById('pdfmodal'); if(m)m.remove();
  m=document.createElement('div'); m.id='pdfmodal';
  m.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:9999;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch';
  const dAmt=r.discAmt||0;
  const banner = dAmt<-0.5 ? `<div style="background:#7f1d1d;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;margin-top:6px">\u2193 Shorted by ${fmt(-dAmt)}</div>`
    : dAmt>0.5 ? `<div style="background:#14532d;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;margin-top:6px">\u2191 Overpaid by ${fmt(dAmt)}</div>` : '';
  const issuesHtml = flags.length ? '<b style="color:#fda4af">Highlighted below:</b><ul style="margin:6px 0 0;padding-left:18px">'+flags.map(f=>'<li>'+f.reason+'</li>').join('')+'</ul>'
    : '<b style="color:#86efac">\u2713 No discrepancies detected on this stub.</b>';
  m.innerHTML='<div style="max-width:820px;margin:0 auto;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><div><div style="font-size:18px;font-weight:700">Single paystub review \u2014 '+(r.date||'')+'</div><div style="font-size:13px;margin-top:4px">'+issuesHtml+'</div>'+banner+'</div><button onclick="document.getElementById(\'pdfmodal\').remove()" style="background:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700">Close</button></div><div id="pdfpages"></div></div>';
  document.body.appendChild(m);
  const host=m.querySelector('#pdfpages');
  const cssW=Math.min(780,window.innerWidth-28);
  const scale=cssW/(pages[0].page.getViewport({scale:1}).width);
  const dpr=Math.min(3, (window.devicePixelRatio||1)*1.5);     // render sharp, display at css width
  for(const pg of pages){ const vp=pg.page.getViewport({scale:scale*dpr}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    cv.style.cssText='width:100%;height:auto;background:#fff;border-radius:8px;margin-bottom:12px;display:block'; host.appendChild(cv);
    const ctx=cv.getContext('2d'); await pg.page.render({canvasContext:ctx,viewport:vp}).promise;
    // highlight bands (translucent) instead of circles \u2014 readable even when lines are close
    const hits=pg.lines.filter(ln=>flags.some(f=>f.re.test(ln.text)));
    hits.forEach(ln=>{ const a=vp.convertToViewportPoint(ln.x0,ln.y), b=vp.convertToViewportPoint(ln.x1,ln.y);
      const x=Math.min(a[0],b[0])-6*dpr, w=Math.abs(b[0]-a[0])+12*dpr, h=20*dpr, yc=a[1]-15*dpr;
      ctx.fillStyle='rgba(250,204,21,.38)'; ctx.fillRect(x,yc,w,h);
      ctx.strokeStyle='#e11d48'; ctx.lineWidth=2*dpr; ctx.strokeRect(x,yc,w,h); }); }
}
async function storeAndRecord(file, lines, status){
  const r=checkParsed(lines); if(r.date==='?') return r;
  const id='pdf-'+r.date;
  try{ if(file) await idbPut(id, file); }catch(e){}
  const prior=S.history.find(h=>h.date===r.date);
  S.history = S.history.filter(h=>h.date!==r.date);   // upsert by pay-end date
  S.history.unshift({date:r.date, type:r.type, gross:r.gross, net:r.net, taxes:r.taxes, ded:r.ded,
    fed:r.fed, state:r.state, fica:r.fica, trad:r.trad, roth:r.roth, hsa:r.hsa, loan:r.loan, eff:r.eff,
    discAmt:r.discAmt, ok:r.ok, issues:r.issues, pdfId:file?id:null,
    status: status || (prior&&prior.status==='reviewed'?'reviewed':'new')});
  save(); return r;
}

/* ---------- pay math ---------- */
const fmt = n => (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => '$'+Math.round(n).toLocaleString('en-US');
function annivCount(hire, asOf){ // completed years since hire (anniversary each year)
  const h=new Date(hire), d=new Date(asOf); let y=d.getFullYear()-h.getFullYear();
  const annThisYear=new Date(d.getFullYear(), h.getMonth(), h.getDate());
  if(d<annThisYear) y--; return Math.max(0,y);
}
function stepFor(asOf){ return Math.min(10, annivCount(S.hireDate, asOf)); }
function rateCol(asOf){ const d=new Date(asOf); if(d<new Date('2023-12-01'))return '2022'; if(d<new Date('2024-12-01'))return '2023'; return '2024'; }
function activeChart(){ const prem=(S.baseScale==='premium'); const ov=prem?S.chartPremiumOverride:S.chartOverride; return ov||(prem?CHART_PREMIUM:CHART); }
function monthlyBase(asOf){ return activeChart()[rateCol(asOf)][stepFor(asOf)]; }
function hourly(asOf){ return monthlyBase(asOf)*12/HRS_YEAR; }
function licenseMonthly(asOf){ return LICENSE_FLAT + LICENSE_VAR*monthlyBase(asOf); }
function qualPremiumMonthly(){ const q=S.quals||{}, R=S.premRates||{intlFirst:200,intlAddl:100,intlCap:400,ifs:200,lca:200,wbom:200}; let p=0;
  if(q.intlAreas>0) p+=Math.min(R.intlCap, R.intlFirst+(q.intlAreas-1)*R.intlAddl);
  if(q.ifs) p+=R.ifs; if(q.lca) p+=R.lca; if(q.wbom) p+=R.wbom; return p; }
function qualBreakdown(){ const q=S.quals||{}, R=S.premRates||{}; const parts=[];
  if(q.intlAreas>0) parts.push(`Intl \u00d7${q.intlAreas} (${fmt0(Math.min(R.intlCap,R.intlFirst+(q.intlAreas-1)*R.intlAddl))})`);
  if(q.ifs) parts.push(`IFS (${fmt0(R.ifs)})`); if(q.lca) parts.push(`LCA (${fmt0(R.lca)})`); if(q.wbom) parts.push(`WB-OM (${fmt0(R.wbom)})`);
  return parts.join(' + '); }
function perCheckBase(asOf){ return monthlyBase(asOf)/2; }
function perCheckLicense(asOf){ return licenseMonthly(asOf)/2; }
function otPay(asOf, totalDays, doubleDays){
  const hr=hourly(asOf); const d15=Math.max(0,totalDays-doubleDays);
  return d15*8*hr*1.5 + doubleDays*8*hr*2;
}

/* ---------- projection (mirrors planning model) ---------- */
function salaryYr(y){ const step=Math.min(2+(y-2026),10); return CHART['2024'][step]*Math.pow(1.035,Math.max(0,y-2024))*12; }
function annualContrib(y){
  if(y>=retireYear()) return 0;                 // no new contributions once retired
  const sal=salaryYr(y), age=y-(S.birthYear||1990);
  const emp=Math.min((S.tradPct+S.rothPct)*sal, 24500+(age>=50?8000:0));
  const er=0.09*sal, rothT=S.rothIRAannual;
  const rothJ=(S.jhanNetMonthly>0 && y>=2028)?S.rothIRAannual:0;
  const hsa=(y>=S.hsaResumeYear?S.hsaAnnual:0);
  return emp+er+rothT+rothJ+hsa+S.jhanInvestAnnual;
}
function retireYear(){ return (S.birthYear||1990)+(S.retireAge||55); }
function expectedBalance(asOf){
  const start=new Date(S.startBalanceDate), end=new Date(asOf); let bal=S.startBalance;
  const rM=Math.pow(1+S.annualReturn,1/12)-1;
  let cur=new Date(start.getFullYear(),start.getMonth(),1);
  while(cur<end){ const y=cur.getFullYear(); bal=bal*(1+rM)+annualContrib(y)/12; cur.setMonth(cur.getMonth()+1); }
  return bal;
}
function projAtRetire(){ return expectedBalance(new Date(retireYear(),11,31).toISOString().slice(0,10)); }

/* ---------- IRS limits (dynamic by year) & tax math ---------- */
const IRS_LIMITS = {
  2025:{deferral:23500, catch50:7500, catch60:11250, ira:7000, hsaSelf:4300, hsaFamily:8550, dc415:70000, compCap:350000, stdMFJ:30000},
  2026:{deferral:24500, catch50:8000, catch60:11250, ira:7000, hsaSelf:4400, hsaFamily:8750, dc415:72000, compCap:360000, stdMFJ:31500}
};
function irs(y){ return IRS_LIMITS[y] || IRS_LIMITS[Math.max(...Object.keys(IRS_LIMITS).map(Number))]; }
// Federal MFJ tax tables by year (IRS Rev Procs). brackets: [upperBound, rate]; std = standard deduction.
const TAX_TABLE = {
  2024:{ std:29200, brackets:[[23200,.10],[94300,.12],[201050,.22],[383900,.24],[487450,.32],[731200,.35],[Infinity,.37]] },
  2025:{ std:31500, brackets:[[23850,.10],[96950,.12],[206700,.22],[394600,.24],[501050,.32],[751600,.35],[Infinity,.37]] },
  2026:{ std:32200, brackets:[[24800,.10],[100800,.12],[211100,.22],[402500,.24],[510300,.32],[768700,.35],[Infinity,.37]] }
};
function taxYears(){ return Object.keys(S.taxOverride||TAX_TABLE).map(Number).sort((a,b)=>a-b); }
function taxFor(y){ const T=S.taxOverride||TAX_TABLE; if(T[y])return T[y]; const ys=taxYears(); return T[ys[ys.length-1]]; }  // go out as far as published, then hold latest
function fedTax(taxable,y){ const br=taxFor(y).brackets; let t=0,prev=0; for(const [cap,rate] of br){ if(taxable>prev){ t+=(Math.min(taxable,cap)-prev)*rate; prev=cap; } else break; } return Math.max(0,t); }
function fedMarginal(taxable,y){ for(const [cap,rate] of taxFor(y).brackets){ if(taxable<=cap) return rate; } return .37; }
function stdMFJ(y){ return taxFor(y).std; }

/* ---------- PDF PARSER (in-browser, pdf.js) ---------- */
async function fileToLines(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise; let lines=[];
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const rows={}; tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push([it.transform[4],it.str]); });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{ const ln=rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ').replace(/\s+/g,' ').trim(); if(ln)lines.push(ln); });
  }
  return lines;
}
async function parsePaystub(ev){
  const f=ev.target.files[0]; if(!f) return; const st=document.getElementById('parsestatus');
  st.textContent='Parsing\u2026';
  try{ const lines=await fileToLines(f); window.__lastFile=f; fillFromLines(lines); runVerify();
    const r=await storeAndRecord(f, lines, 'reviewed');
    st.textContent = r.date==='?' ? '\u2713 Parsed \u2014 review and Verify (couldn\u2019t read pay date, so not auto-saved).'
      : '\u2713 Parsed, verified & saved to History \u2014 PDF stored on this device ('+r.date+').';
  }
  catch(e){ st.textContent='Could not parse this PDF automatically \u2014 enter figures manually. ('+e.message+')'; }
}
const _nums=s=>(s.match(/-?[\d,]+\.\d{2,4}/g)||[]).map(x=>parseFloat(x.replace(/,/g,'')));
const _hasDate=s=>/\d{2}\/\d{2}\/\d{4}/.test(s);
function fillFromLines(lines){
  const setv=(id,v)=>{ const el=document.getElementById(id); if(el&&v!=null)el.value=v; };
  const blob=lines.join('\n');
  const pe=blob.match(/Pay End Date:?\s*(\d{2})\/(\d{2})\/(\d{4})/);
  if(pe){ setv('cdate',`${pe[3]}-${pe[1]}-${pe[2]}`); }
  const lic=lines.find(l=>/Dispatcher License Pay/i.test(l)&&_hasDate(l));
  const typeEl=document.getElementById('ctype'); if(typeEl) typeEl.value = lic ? 'big' : 'little';
  // deductions via global regex (robust to multi-column joined lines)
  const defs=[...blob.matchAll(/401\(k\) Deferral\s+([\d,]+\.\d{2})/g)].map(m=>parseFloat(m[1].replace(/,/g,'')));
  const hsaM=blob.match(/Health Savings Account[^\n]*?(\d[\d,]*\.\d{2})/);
  const megaM=blob.match(/401\(k\) Post-?tax Deferral\s+([\d,]+\.\d{2})/);
  const loanM=blob.match(/401\(k\) Loan(?:\s*\d+)?\s+([\d,]+\.\d{2})/);
  const cur=lines.find(l=>/^Current\b/.test(l)&&_nums(l).length>=5); const c=cur?_nums(cur):null;
  if(c){ setv('aGross',c[0]); setv('aNet',c[4]); window.__summary={gross:c[0],taxes:c[2],ded:c[3],net:c[4]}; }
  else window.__summary=null;
  if(defs[0]!=null) setv('aTrad',defs[0]);                 // 1st = before-tax (Traditional)
  if(defs[1]!=null) setv('aRoth',defs[1]);                 // 2nd = after-tax (Roth)
  if(hsaM) setv('aHSA',parseFloat(hsaM[1].replace(/,/g,'')));
  if(megaM) setv('aMega',parseFloat(megaM[1].replace(/,/g,'')));
  window.__loan = loanM?parseFloat(loanM[1].replace(/,/g,'')):0;
  const shiftL=lines.find(l=>/Shift Differential/i.test(l));
  if(shiftL){ const sn=_nums(shiftL); if(sn.length>=3){ const rate=sn[0];
    setv('shifttype', rate>=0.59?'0.59':(rate>=0.52?'0.52':'0')); setv('shifthrs', sn[1]); setv('aShift', sn[2]); } }
  window.__rated=[]; lines.forEach(l=>{ const m=l.match(/^([A-Za-z()\/ ]+?)\s+\d{2}\/\d{2}\/\d{4}.*?(\d+\.\d{4})/); if(m){ window.__rated.push({label:m[1].trim(),rate:parseFloat(m[2])}); } });
  const e=document.getElementById('cdate'); if(e){ e.dispatchEvent(new Event('change')); }
}
/* ---------- BATCH ---------- */
async function batchVerify(ev){
  const files=[...ev.target.files]; if(!files.length) return; const out=document.getElementById('batchresult');
  out.innerHTML='Parsing '+files.length+' file(s)\u2026'; const results=[];
  for(const f of files){ try{ const lines=await fileToLines(f); results.push(checkParsed(lines)); await storeAndRecord(f, lines, 'new'); }
    catch(e){ results.push({date:f.name,type:'?',gross:0,net:0,ok:false,issues:['parse failed']}); } }
  results.sort((a,b)=>a.date>b.date?1:-1);
  let h='<table><tr><th>Pay end</th><th>Type</th><th class="num">Gross</th><th class="num">Net</th><th>Result</th></tr>';
  let pass=0; results.forEach(r=>{ if(r.ok)pass++; const clk=r.date&&r.date!=='?'?`style="cursor:pointer" onclick="reviewPdf('pdf-${r.date}')" title="Open single review"`:'';
    h+=`<tr ${clk}><td>${r.date}</td><td>${r.type}</td><td class="num">${fmt(r.gross)}</td><td class="num">${fmt(r.net)}</td><td><span class="pill ${r.ok?'ok':'no'}">${r.ok?'\u2713 pass':'\u2717 '+r.issues.join('; ')}</span></td></tr>`; });
  const sumNet=results.reduce((s,r)=>s+r.net,0);
  h+=`</table><p class="muted">${pass}/${results.length} passed \u00b7 tap any row to open its single review with the PDF circled. Combined net: ${fmt(sumNet)}. All saved to the Queue as <b>New</b>.</p>`;
  out.innerHTML=h;
}
function checkParsed(lines){
  const blob=lines.join('\n'); const issues=[];
  const pe=blob.match(/Pay End Date:?\s*(\d{2})\/(\d{2})\/(\d{4})/);
  const date = pe?`${pe[3]}-${pe[1]}-${pe[2]}`:'?';
  const base=date!=='?'?perCheckBase(date):0, hr=date!=='?'?hourly(date):0;
  const licL=lines.find(l=>/Dispatcher License Pay/i.test(l)&&_hasDate(l)); const type=licL?'big':'little';
  const cur=lines.find(l=>/^Current\b/.test(l)&&_nums(l).length>=5); const c=cur?_nums(cur):null;
  const gross=c?c[0]:0, taxes=c?c[2]:0, ded=c?c[3]:0, net=c?c[4]:0;
  const grab=re=>{ const l=lines.find(x=>re.test(x)); return l?(_nums(l).pop()||0):0; };
  const fed=grab(/Federal\s+(Income\s+)?Tax|Fed(eral)?\s+Withholding|Fed\s+W\/?H/i);
  const ss=grab(/Social Security|OASDI|Fed\s+OASDI/i);
  const med=grab(/Medicare|Fed\s+MED/i);
  const state=grab(/IL\b.*(Tax|Withholding)|State\s+(Income\s+)?Tax|Illinois/i);
  const fica=ss+med;
  const defs=[...blob.matchAll(/401\(k\) Deferral\s+([\d,]+\.\d{2})/g)].map(m=>parseFloat(m[1].replace(/,/g,'')));
  const hsaM=blob.match(/Health Savings Account[^\n]*?(\d[\d,]*\.\d{2})/);
  const loanM=blob.match(/401\(k\) Loan(?:\s*\d+)?\s+([\d,]+\.\d{2})/);
  const trad=defs[0]||0, roth=defs[1]||0, hsa=hsaM?parseFloat(hsaM[1].replace(/,/g,'')):0, loan=loanM?parseFloat(loanM[1].replace(/,/g,'')):0;
  const regL=lines.find(l=>/^Regular Pay\b/i.test(l)&&!_hasDate(l)); const reg=regL?_nums(regL)[0]:null;
  let discAmt=0;
  if(reg!=null && date!=='?' && Math.abs(reg-base)>1){ issues.push('base off'); discAmt+=reg-base; }
  if(licL && date!=='?'){ const ln=_nums(licL); if(ln.length && Math.abs(ln[0]-licenseMonthly(date))>1){ issues.push('license off'); discAmt+=ln[0]-licenseMonthly(date); } }
  if(c && Math.abs((gross-taxes-ded)-net)>0.02) issues.push('net mismatch');
  if(date!=='?') lines.forEach(l=>{ const m=l.match(/^([A-Za-z()\/ ]+?)\s+\d{2}\/\d{2}\/\d{4}.*?(\d+\.\d{4})/); if(m){ const rt=parseFloat(m[2]); if(rt>10 && Math.abs(rt-hr)>0.02){ issues.push(m[1].trim()+' rate'); const ns=_nums(l); const amt=ns[ns.length-1], hrs=ns.length>=3?ns[1]:0; if(hrs>0&&amt>0) discAmt+=amt-(hr*hrs*(rt>hr*1.4?1.5:1)); } } });
  const eff = gross>0 ? taxes/gross : 0;
  return {date, type, gross, net, taxes, ded, fed, state, fica, trad, roth, hsa, loan, eff, discAmt:Math.round(discAmt*100)/100, ok:issues.length===0, issues};
}
function saveCheck(){
  runVerify();
  const d=document.getElementById('cdate').value;
  const type=(document.getElementById('ctype')||{}).value||'big';
  S.history.unshift({date:d, type, gross:val('aGross'), net:val('aNet'), trad:val('aTrad'), roth:val('aRoth'), hsa:val('aHSA'), mega:val('aMega')});
  if(val('aNet')>0){ if(type==='big')S.bigNet=val('aNet'); else S.littleNet=val('aNet'); }
  save(); alert('Saved to history ('+type+' check).');
}

function parseCSV(text){
  const rows=[]; let field='',row=[],inq=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inq){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inq=false; } else field+=c; }
    else if(c==='"') inq=true;
    else if(c===',') { row.push(field); field=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; if(field!==''||row.length){ row.push(field); rows.push(row); row=[]; field=''; } }
    else field+=c; }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
async function importBudgetCSV(ev){
  const f=ev.target.files[0]; if(!f)return; const st=document.getElementById('csvstatus'); st.textContent='Reading\u2026';

    const di=H.indexOf('Date'), ai=H.indexOf('Amount'), ci=H.indexOf('Category'), ni=H.indexOf('Name');
    if(di<0||ai<0||ci<0){ st.textContent='Unexpected CSV format \u2014 need Date, Amount, Category columns.'; return; }
    const data=rows.slice(1).map(r=>({date:new Date(r[di]),amt:parseFloat(r[ai]),cat:(r[ci]||'').trim(),name:(r[ni]||'')}))
      .filter(d=>!isNaN(d.date)&&!isNaN(d.amt));
    if(!data.length){ st.textContent='No transactions found.'; return; }
    const rec=data;   // use the full export span (e.g. last 2 years)
    const months=new Set(rec.map(d=>d.date.getFullYear()+'-'+d.date.getMonth())).size||1;
    const excl=new Set(['Credit Card Payment','Cash & Checks','Rent','Loan Payment']); const rentRe=/ROBIN PROPERTY|Livble/i;
    const interest=rec.filter(d=>/INTEREST CHARGE/i.test(d.name)).reduce((s,d)=>s+d.amt,0)/months;
    const agg={};
    rec.forEach(d=>{ if(d.amt<=0||excl.has(d.cat)||rentRe.test(d.name))return; const k=d.cat||'Uncategorized'; agg[k]=(agg[k]||0)+d.amt; });
    Object.keys(agg).forEach(k=>agg[k]=Math.round(agg[k]/months));
    S.imported=agg; S.importedMeta={months,count:rec.length,interest:Math.round(interest)}; save();
    applyImported();   // auto-create/refresh budget categories
    const st2=document.getElementById('csvstatus'); if(st2) st2.innerHTML=`\u2713 ${rec.length} transactions over ~${months} months \u2014 auto-applied to your budget.`;
  }catch(e){ st.textContent='Could not read CSV \u2014 '+e.message; }
}

  let rows=S.history.map((h,i)=>{ const isNew=h.status!=='reviewed';

    return `<tr style="${isNew?'background:rgba(225,29,72,.06)':''}"><td><input type="checkbox" ${qSel.has(h.date)?'checked':''} onclick="qSelToggle('${h.date}',this.checked)"></td><td>${h.date}</td><td>${h.type||'\u2014'}</td><td class="num">${fmt(h.gross)}</td><td class="num">${fmt(h.net)}</td><td class="num">${discCell(h.discAmt)}</td><td>${h.ok===true?'<span class="pill ok">\u2713</span>':h.ok===false?'<span class="pill no">\u2717</span>':''}</td><td><span class="pill ${isNew?'no':'ok'}">${isNew?'New':'Reviewed'}</span></td>${extra}<td>${h.pdfId?`<button class="act ghost" style="padding:3px 6px" onclick="reviewPdf('${h.pdfId}')">View</button> <button class="act ghost" style="padding:3px 6px" onclick="downloadPdf('${h.pdfId}','${h.date}')">Save</button>`:'\u2014'}</td><td>${isNew?`<button class="act ghost" style="padding:3px 6px" onclick="markReviewed(${i})">\u2713</button> `:''}<button class="act ghost" style="padding:3px 8px" onclick="histDel(${i})">\u2715</button></td></tr>`; }).join('');
  return top+`<div class="card" style="overflow-x:auto"><table><tr><th><input type="checkbox" onclick="qSelAll(this.checked)"></th><th>Date</th><th>Type</th><th class="num">Gross</th><th class="num">Net</th><th class="num">Disc.</th><th>Check</th><th>Status</th>${extraHead}<th>PDF</th><th></th></tr>${rows}</table>
  <p class="muted" style="margin-top:8px"><b>Disc.</b> = discrepancy vs contract (+ overpaid / \u2212 shorted). <b>View</b> opens the circled review. <b>Save</b> downloads <code>paystub-(date).pdf</code>.</p>
  <button class="act ghost" style="margin-top:6px" onclick="exportAllPdfs()">Export all paystubs to a folder</button></div>`;
}
function markReviewed(i){ if(S.history[i]){ S.history[i].status='reviewed'; save(); render(); } }
function histDel(i){ const h=S.history[i]; if(h&&h.pdfId)idbDel(h.pdfId); S.history.splice(i,1);save();render(); }

/* ---------- SETTINGS ---------- */
function vSettings(){
  const q=S.quals||{}, R=S.premRates||{}; const cy=new Date().getFullYear(); const L=irs(cy);
  return `<div class="card"><h2>Settings</h2><p class="muted">Grouped by the tab each setting affects.</p></div>

  <div class="card"><h2>\u2699\ufe0f Paycheck</h2><div class="grid">
    <div><label>Hire/anniversary date</label><input type="date" id="s_hire" value="${S.hireDate}"></div>
    <div><label>Base pay scale</label><select id="s_scale"><option value="standard" ${S.baseScale!=='premium'?'selected':''}>Domestic Dispatcher (standard)</option><option value="premium" ${S.baseScale==='premium'?'selected':''}>Chief / OM / ATC Coord / FT Instructor</option></select><div class="hint">Premium-desk roles are paid on a higher scale, not a bonus.</div></div>
    <div><label>401(k) Traditional election %</label><input type="number" step="0.01" id="s_trad" value="${S.tradPct}"><div class="hint">0.06 = 6%</div></div>
    <div><label>401(k) Roth election %</label><input type="number" step="0.01" id="s_roth" value="${S.rothPct}"><div class="hint">0.11 = 11%</div></div>
  </div>
  <h2 style="margin-top:14px">Special qualifications (monthly premiums, 13-A)</h2>
  <p class="muted">Domestic is always the base. Tick what you hold \u2014 these stack on top, on your big check.</p>
  <div class="grid">
    <div><label>International area qualifications (#)</label><input type="number" id="s_intl" value="${q.intlAreas||0}"><div class="hint">${fmt0(R.intlFirst)} first area + ${fmt0(R.intlAddl)} each more, cap ${fmt0(R.intlCap)}</div></div>
    <div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s_ifs" ${q.ifs?'checked':''}> IFS qualification (${fmt0(R.ifs)}/mo)</label></div>
    <div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s_lca" ${q.lca?'checked':''}> LCA qualification (${fmt0(R.lca)}/mo)</label></div>
    <div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s_wbom" ${q.wbom?'checked':''}> Widebody OM (${fmt0(R.wbom)}/mo)</label></div>
  </div>
  <p class="hint">Current qualification premium: <b>${fmt0(qualPremiumMonthly())}/mo</b>${qualBreakdown()?' \u2014 '+qualBreakdown():''}. Verified against your big check.</p></div>

  <div class="card"><h2>\ud83d\udcc8 Retirement</h2><div class="grid">
    <div><label>Retirement age</label><input type="number" id="s_rage" value="${S.retireAge||55}"></div>
    <div><label>Birth year</label><input type="number" id="s_by" value="${S.birthYear||1990}"></div>
    <div><label>Annual return assumption</label><input type="number" step="0.005" id="s_ret" value="${S.annualReturn}"></div>
    <div><label>Starting retirement balance</label><input type="number" id="s_sb" value="${S.startBalance}"></div>
    <div><label>As of date</label><input type="date" id="s_sbd" value="${S.startBalanceDate}"></div>
    <div><label>Jhan invests / yr (timeline)</label><input type="number" id="s_ji" value="${S.jhanInvestAnnual}"></div>
    <div><label>Roth IRA target / yr</label><input type="number" id="s_ira" value="${S.rothIRAannual}"><div class="hint">IRS IRA limit ${cy}: ${fmt0(L.ira)}</div></div>
    <div><label>HSA target / yr</label><input type="number" id="s_hsa" value="${S.hsaAnnual}"><div class="hint">HSA family ${cy}: ${fmt0(L.hsaFamily)}</div></div>
    <div><label>HSA resume year</label><input type="number" id="s_hsay" value="${S.hsaResumeYear}"></div>
    <div><label>401(k) Trad target / yr ($, 0=auto)</label><input type="number" id="s_ttrad" value="${S.tgtTrad||0}"></div>
    <div><label>401(k) Roth target / yr ($, 0=auto)</label><input type="number" id="s_troth" value="${S.tgtRoth||0}"></div>
    <div><label>Employer target / yr ($, 0=auto)</label><input type="number" id="s_temp" value="${S.tgtEmployer||0}"></div>
  </div>
  <h2 style="margin-top:14px">Extra retirement accounts</h2>
  <table><tr><th>Account</th><th class="num">Annual target</th><th></th></tr>
  ${(S.retAccounts||[]).map((a,i)=>`<tr><td><input value="${a.name}" onchange="acctField(${i},'name',this.value)" style="padding:3px;width:150px"></td><td class="num"><input type="number" value="${a.annual||0}" onchange="acctField(${i},'annual',this.value)" style="width:110px;padding:3px"></td><td><button class="act ghost" style="padding:3px 8px" onclick="acctDel(${i})">\u2715</button></td></tr>`).join('')}
  </table><button class="act ghost" style="margin-top:6px" onclick="acctAdd()">+ Add account</button></div>

  <div class="card"><h2>\ud83e\uddfe Tax</h2><p class="muted">Filing status: Married Filing Jointly. Federal brackets &amp; standard deduction for ${cy}: ${fmt0(stdMFJ(cy))} std deduction, top loaded bracket ${ (fedMarginal(9e9,cy)*100) }%. Tables run through ${Math.max(...taxYears())} and hold the latest year beyond that. Edit them under Advanced.</p></div>

  <div class="card"><h2>\ud83d\udcb0 Budget</h2><div class="grid">
    <div><label>Jhan take-home / mo</label><input type="number" id="s_jn" value="${S.jhanNetMonthly}"></div>
  </div></div>

  <div class="card"><h2>\ud83d\udcc4 Queue / PDFs</h2>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="act ghost" onclick="connectFolder()">Connect PDF folder</button><button class="act ghost" onclick="importFromFolder()">Import from folder</button><button class="act ghost" onclick="exportAllPdfs()">Export all paystubs</button></div></div>

  <div class="card"><h2>\ud83d\udcbe Data (sharing)</h2>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="act ghost" onclick="exportData()">Export data file</button>
    <label class="act ghost" style="cursor:pointer">Import data file<input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none"></label>
    <button class="act ghost" onclick="if(confirm('Erase all saved data in this browser?')){localStorage.removeItem('dispatchPay');S=load();render();}">Reset all data</button></div>
    <p class="muted" style="margin-top:8px">Save the data file in a synced folder (iCloud/Drive) and Import it on the other device to share numbers.</p></div>

  <div class="card"><div class="row" style="gap:8px;flex-wrap:wrap"><button class="act" onclick="saveSettings()">Save settings</button>
    <button class="act ghost" onclick="advToggle()">${advOpen?'Hide':'Show'} Advanced settings</button></div>
    ${advOpen?advSettings():''}
  </div>`;
}
let advOpen=false; function advToggle(){ advOpen=!advOpen; render(); }
function advSettings(){ const R=S.premRates||{};
  return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
    <h2>Advanced settings</h2>
    <p class="muted">Only edit if the contract or tax law changes. Wrong values here change every calculation.</p>
    <h2 style="margin-top:12px;font-size:15px">Qualification premium rates (contract 13-A)</h2>
    <div class="grid">
      <div><label>Intl \u2014 first area</label><input type="number" id="a_if" value="${R.intlFirst}"></div>
      <div><label>Intl \u2014 each additional</label><input type="number" id="a_ia" value="${R.intlAddl}"></div>
      <div><label>Intl \u2014 monthly cap</label><input type="number" id="a_ic" value="${R.intlCap}"></div>
      <div><label>IFS / month</label><input type="number" id="a_ifs" value="${R.ifs}"></div>
      <div><label>LCA / month</label><input type="number" id="a_lca" value="${R.lca}"></div>
      <div><label>Widebody OM / month</label><input type="number" id="a_wbom" value="${R.wbom}"></div>
    </div>
    <button class="act ghost" style="margin-top:8px" onclick="advSavePrem()">Save premium rates</button>
    <h2 style="margin-top:14px;font-size:15px">Pay charts (monthly base by step)</h2>
    <p class="muted">JSON: keys are effective-date columns, arrays are steps 0\u201310. Leave blank to use the built-in contract values.</p>
    <label>Standard (Domestic) scale override</label>
    <textarea id="a_chart" style="width:100%;height:80px;font-family:monospace;font-size:12px">${S.chartOverride?JSON.stringify(S.chartOverride):''}</textarea>
    <label>Premium (Chief/OM/ATC/FTI) scale override</label>
    <textarea id="a_chartp" style="width:100%;height:80px;font-family:monospace;font-size:12px">${S.chartPremiumOverride?JSON.stringify(S.chartPremiumOverride):''}</textarea>
    <button class="act ghost" style="margin-top:8px" onclick="advSaveCharts()">Save pay charts</button>
    <h2 style="margin-top:14px;font-size:15px">Federal tax tables (MFJ)</h2>
    <p class="muted">JSON by year: {"2027":{"std":NNNNN,"brackets":[[cap,rate],...]}}. The app uses the matching year, or holds the latest year for future years.</p>
    <textarea id="a_tax" style="width:100%;height:110px;font-family:monospace;font-size:12px">${JSON.stringify(S.taxOverride||TAX_TABLE,null,0)}</textarea>
    <button class="act ghost" style="margin-top:8px" onclick="advSaveTax()">Save tax tables</button>
    <h2 style="margin-top:14px;font-size:15px">Load a new contract</h2>
    <p class="muted">Upload a new PAFCA agreement PDF. The app extracts the salary tables in your browser and shows what it found so you can apply them. For anything it can\u2019t read cleanly, use <b>Export contract text</b> and paste it to Claude to generate the JSON above.</p>
    <input type="file" id="a_contract" accept="application/pdf" onchange="parseContract(event)">
    <div id="a_contractres" class="hint" style="margin-top:6px"></div>
  </div>`;
}
function advSavePrem(){ S.premRates={ intlFirst:+val('a_if')||0, intlAddl:+val('a_ia')||0, intlCap:+val('a_ic')||0, ifs:+val('a_ifs')||0, lca:+val('a_lca')||0, wbom:+val('a_wbom')||0 }; save(); alert('Premium rates saved.'); render(); }
function advSaveCharts(){ try{ const c=document.getElementById('a_chart').value.trim(), p=document.getElementById('a_chartp').value.trim();
  S.chartOverride=c?JSON.parse(c):null; S.chartPremiumOverride=p?JSON.parse(p):null; save(); alert('Pay charts saved.'); }catch(e){ alert('Invalid JSON: '+e.message); } }
function advSaveTax(){ try{ const t=document.getElementById('a_tax').value.trim(); S.taxOverride=t?JSON.parse(t):null; save(); alert('Tax tables saved.'); }catch(e){ alert('Invalid JSON: '+e.message); } }
async function parseContract(ev){ const f=ev.target.files[0]; if(!f)return; const st=document.getElementById('a_contractres'); st.textContent='Reading contract\u2026 (large files take a moment)';
  try{ const lines=await fileToLines(f); const blob=lines.join('\n');
    window.__contractText=blob;
    // best-effort: rows like "0 $ 7,161 $ 7,711 $ 8,073" \u2014 step then 3 monthly figures
    const rowRe=/(?:^|\n)\s*(\d{1,2})\s+\$\s*([\d,]+)\s+\$\s*([\d,]+)\s+\$\s*([\d,]+)/g;
    const clean=s=>parseInt(String(s).replace(/[^\d]/g,''),10);
    const found=[]; let m; while((m=rowRe.exec(blob))){ const step=+m[1]; const a=clean(m[2]),b=clean(m[3]),c=clean(m[4]);
      if(step>=0&&step<=10&&a>4000&&a<30000&&c>4000&&c<30000) found.push([step,a,b,c]); }
    if(!found.length){ st.innerHTML='Couldn\u2019t auto-read the tables. Use <b>Export contract text</b> below and paste it to Claude.<br><button class="act ghost" style="margin-top:6px" onclick="exportContractText()">Export contract text</button>'; return; }
    st.innerHTML=`Found ${found.length} salary rows. First/last column become effective-date columns. Review then apply:<br><pre style="font-size:11px;overflow:auto;max-height:160px">${found.map(r=>r.join('  ')).join('\n')}</pre>
      <button class="act" style="margin-top:6px" onclick="applyContract()">Apply as Standard scale</button>
      <button class="act ghost" style="margin-top:6px" onclick="applyContract(true)">Apply as Premium scale</button>
      <button class="act ghost" style="margin-top:6px" onclick="exportContractText()">Export contract text</button>`;
    window.__contractRows=found;
  }catch(e){ st.textContent='Could not read this PDF: '+e.message; }
}
function applyContract(premium){ const f=window.__contractRows; if(!f||!f.length){ alert('Parse a contract first.'); return; }
  // take first 11 unique steps 0..10
  const by={}; f.forEach(r=>{ if(by[r[0]]===undefined) by[r[0]]=r; });
  const col=(k)=>Array.from({length:11},(_,s)=> (by[s]?by[s][k]:0));
  const obj={}; const yrs=['2022','2023','2024']; for(let k=1;k<=3;k++) obj[yrs[k-1]]=col(k);
  if(premium) S.chartPremiumOverride=obj; else S.chartOverride=obj; save();
  alert('Applied. Confirm the numbers look right on the Paycheck tab; you can fine-tune the JSON in Advanced.'); render();
}
function exportContractText(){ const t=window.__contractText||''; if(!t){ alert('Parse a contract first.'); return; }
  const blob=new Blob([t],{type:'text/plain'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='contract-text.txt'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),5000); }
function saveSettings(){
  S.hireDate=document.getElementById('s_hire').value; S.annualReturn=parseFloat(document.getElementById('s_ret').value)||0.07;
  S.retireAge=parseInt(document.getElementById('s_rage').value)||55; S.birthYear=parseInt(document.getElementById('s_by').value)||1990;
  S.startBalance=parseFloat(document.getElementById('s_sb').value)||0; S.startBalanceDate=document.getElementById('s_sbd').value;
  S.jhanInvestAnnual=parseFloat(document.getElementById('s_ji').value)||0; S.jhanNetMonthly=parseFloat(document.getElementById('s_jn').value)||0;
  S.rothIRAannual=parseFloat(document.getElementById('s_ira').value)||0; S.hsaResumeYear=parseInt(document.getElementById('s_hsay').value)||2027;
  S.tradPct=parseFloat(document.getElementById('s_trad').value)||0; S.rothPct=parseFloat(document.getElementById('s_roth').value)||0;
  S.tgtTrad=parseFloat(document.getElementById('s_ttrad').value)||0; S.tgtRoth=parseFloat(document.getElementById('s_troth').value)||0;
  S.tgtEmployer=parseFloat(document.getElementById('s_temp').value)||0; S.hsaAnnual=parseFloat(document.getElementById('s_hsa').value)||0;
  S.baseScale=(document.getElementById('s_scale')||{}).value||'standard';
  S.quals={ intlAreas:parseInt((document.getElementById('s_intl')||{}).value)||0, ifs:!!(document.getElementById('s_ifs')||{}).checked, lca:!!(document.getElementById('s_lca')||{}).checked, wbom:!!(document.getElementById('s_wbom')||{}).checked };
  save(); alert('Saved.'); go('track');
}
function roleToggle(i,ck){ if(S.roles[i]){ S.roles[i].on=ck; save(); render(); } }
function roleField(i,k,v){ if(S.roles[i]){ S.roles[i][k]=parseFloat(v)||0; save(); } }
function acctAdd(){ S.retAccounts=S.retAccounts||[]; S.retAccounts.push({name:'New account',annual:0}); save(); render(); }
function acctField(i,k,v){ if(S.retAccounts[i]){ S.retAccounts[i][k]= k==='annual'?(parseFloat(v)||0):v; save(); } }
function acctDel(i){ S.retAccounts.splice(i,1); save(); render(); }

/* ---------- boot ---------- */
const _origRender=render;
render=function(){ _origRender(); if(tab==='track') renderPace(); };
render();
try{ importFromFolder(true); }catch(e){}
</script>
